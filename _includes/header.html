<header class="site-header" role="banner">
  {%- assign home_url = "/" | relative_url -%}
  <div class="logo-group">
    <a class="site-logo" rel="author" href="{{ home_url }}">
      <img src="{{ "/assets/images/mensa-logo.png" | relative_url }}" alt="{{ site.title | escape }} logo">
    </a>
    <a class="site-title" rel="author" href="{{ home_url }}">{{ site.title | escape }}</a>
  </div>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
    <svg viewBox="0 0 18 15" width="20" height="17" aria-hidden="true" focusable="false">
      <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
    </svg>
  </label>
  <nav class="site-nav">
    <a href="{{ home_url }}">Home</a>
    <a href="{{ home_url }}#events">Events</a>
    <a href="{{ home_url }}#bulletin">Bulletin Board</a>
    <a href="{{ home_url }}#gallery">Gallery</a>
    <a href="{{ home_url }}#contact">Contact</a>
  </nav>
  <a class="btn-primary" href="https://www.us.mensa.org/Login" target="_blank" rel="noopener">Log in to Mensa</a>
</header>
<script>
  // Close the mobile menu after tapping a link, so jumping to a section
  // doesn't leave the menu covering the page.
  (function () {
    var toggle = document.getElementById('nav-toggle');
    if (!toggle) return;
    document.querySelectorAll('.site-nav a').forEach(function (link) {
      link.addEventListener('click', function () { toggle.checked = false; });
    });
  })();
</script>
