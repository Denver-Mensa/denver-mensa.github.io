name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Exposed as env so the FTP step's `if:` can test it
      # (the `secrets` context is not allowed in `if:` expressions).
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject secrets and build
        env:
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          CALENDAR_API_KEY: ${{ secrets.CALENDAR_API_KEY }}
          GALLERY_URL: ${{ secrets.GALLERY_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          cat > _config.local.yml <<EOF
          calendar:
            id: "${CALENDAR_ID}"
            api_key: "${CALENDAR_API_KEY}"
            timezone: America/Denver
          gallery:
            url: "${GALLERY_URL}"
          contact:
            email: "${CONTACT_EMAIL}"
          EOF
          bundle exec jekyll build --config _config.yml,_config.local.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Publish the same build to the Mensa web host.
      # Skipped automatically if FTP_SERVER is not configured.
      - name: Deploy to FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
